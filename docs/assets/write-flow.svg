      <text x="21" y="42">01 / SELECT</text><text x="279" y="42">02 / CONVERT</text><text x="537" y="42">03 / BACK UP</text>
      <text x="795" y="42">04 / WRITE</text><text x="1053" y="42">05 / VERIFY</text>
