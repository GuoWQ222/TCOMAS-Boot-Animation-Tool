    <rect x="517" y="12" width="226" height="116" rx="14"/><rect x="775" y="12" width="226" height="116" rx="14"/>
    <rect x="1033" y="12" width="246" height="116" rx="14" stroke="#397D6C"/>
  </g>
  <g font-family="Segoe UI, Arial, Microsoft YaHei, sans-serif">
