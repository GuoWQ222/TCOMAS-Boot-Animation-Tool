<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="140" viewBox="0 0 1280 140" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">从本地素材到屏幕的写入流程</title>
  <desc id="desc">01 选择素材，02 写入屏幕，03 完整读回校验。</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="140" gradientUnits="userSpaceOnUse"><stop stop-color="#102C38"/><stop offset="1" stop-color="#0D232E"/></linearGradient>
  </defs>
  <g stroke="#4A9B8D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M399 70H430M424 64L430 70L424 76"/>
    <path d="M847 70H878M872 64L878 70L872 76"/>
  </g>
  <g fill="url(#panel)" stroke="#31545D">
    <rect x="1" y="12" width="382" height="116" rx="14"/>
    <rect x="449" y="12" width="382" height="116" rx="14"/>
    <rect x="897" y="12" width="382" height="116" rx="14" stroke="#397D6C"/>
  </g>
  <g font-family="Segoe UI, Arial, Microsoft YaHei, sans-serif">
    <g fill="#7EE4C5" font-size="13" font-weight="650" letter-spacing="1">
      <text x="25" y="42">01 / SELECT</text>
      <text x="473" y="42">02 / WRITE</text>
      <text x="921" y="42">03 / VERIFY</text>
    </g>
    <g fill="#EEF9F8" font-size="21" font-weight="600">
      <text x="25" y="76">选择素材</text>
      <text x="473" y="76">写入屏幕</text>
      <text x="921" y="76">完整读回校验</text>
    </g>
    <g fill="#9BB8C2" font-size="13">
      <text x="25" y="103">本地图片 / 视频</text>
      <text x="473" y="103">保存到硬件</text>
      <text x="921" y="103">逐字节比较</text>
    </g>
  </g>
</svg>
